            # demo-arena: en modo campo (modo-evento habilitado o activo) no se
            # arranca ninguna app: el lanzador descarga el bitstream
            # (rmoverlay.sh) y, aunque eso falle, arranca el backend, que escribe
            # registros de v0.94 sobre el bitstream del modo evento (24/11).
            access_by_lua '
                if ngx.var.arg_start then
                    local c = os.execute("systemctl is-enabled --quiet modo-evento.service || systemctl is-active --quiet modo-evento.service")
                    if c == 0 or c == true then
                        ngx.status = 409
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say([[{"status":"ERROR","reason":"equipo en modo campo: la web no puede arrancar apps"}]])
                        return ngx.exit(409)
                    end
                end
            ';
