# Panel "Arena" (demo, no campo). Lo incluye www/conf/nginx.conf
# (../apps/*/nginx.conf). nginx corre como root.

# JSON en vivo: esta en RAM, fuera de www. /opt/redpitaya es FAT (sin
# symlinks): se sirve con alias, como hace scopegenpro con /tmp.
location = /arena/ventanas.json {
    alias /run/arena/ventanas.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}

# Arranca la captura de la demo (no bloquea: tarda ~15 s en dar datos).
# La pagina antes descarga los backends de Oscilloscope/DFT (/bazaar?stop=).
location = /arena_iniciar {
    default_type text/plain;
    add_header Cache-Control "no-store";
    content_by_lua '
        local r = os.execute("systemctl start --no-block arena-demo.service")
        ngx.say((r == 0 or r == true) and "OK" or "ERROR")
    ';
}

# Estado del servicio: active / activating / failed / inactive
location = /arena_estado {
    default_type text/plain;
    add_header Cache-Control "no-store";
    content_by_lua '
        local f = io.popen("systemctl is-active arena-demo.service")
        local s = f:read("*all")
        f:close()
        ngx.say((string.gsub(s, "^%s*(.-)%s*$", "%1")))
    ';
}
